name: Build FireBoost APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.kt"
      - "**/*.java"
      - "**/*.xml"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build FireBoost debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

      - name: Validate project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/kotlin/com/fireboost/launcher/MainActivity.kt

      - name: Build debug APK
        run: /tmp/gradle/gradle-8.10.2/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: /tmp/gradle/gradle-8.10.2/bin/gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FireBoost-APK-v1.1.0
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
